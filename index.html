*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--t);font:16px/1.65 Tajawal,'Segoe UI',Tahoma,sans-serif}
#app{flex:1}.c{max-width:1040px;margin:auto;padding:0 16px}main.c{padding-top:24px;padding-bottom:40px}
a{color:var(--p)}h1,h2,h3{margin:0 0 .4em;color:var(--pd)}p{margin:0 0 1em}small,.m{color:var(--m)}
svg{vertical-align:middle;flex-shrink:0}
.top{background:var(--p);position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(15,53,104,.25)}
.bar{display:flex;align-items:center;gap:10px;min-height:58px}.brand{color:#fff;font-weight:800;font-size:19px;text-decoration:none;display:flex;gap:6px;align-items:center}

nav a:hover{background:rgba(255,255,255,.13)}nav a.on{background:#fff;color:var(--p)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;cursor:pointer;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:11px;border:1px solid transparent;font:700 15px Tajawal,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{box-shadow:0 6px 16px rgba(23,74,139,.15)}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}.bo{background:#fff;border-color:var(--b);color:var(--p)}.bd{background:var(--no);color:#fff}.bs{padding:7px 12px;font-size:13.5px}.bk{width:100%}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:18px;box-shadow:0 6px 20px rgba(23,74,139,.07);margin-bottom:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.big{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;padding:26px;transition:transform .2s,box-shadow .2s,border-color .2s}.big:hover{transform:translateY(-3px);border-color:var(--p);box-shadow:0 14px 34px rgba(15,53,104,.16)}
.big .ico{width:54px;height:54px;border-radius:15px;background:var(--pl);color:var(--p);display:grid;place-items:center}
.f{margin-bottom:14px}.f label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}.h{font-size:12.5px;color:var(--m);margin-top:4px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bt{justify-content:space-between}.x1{flex:1;min-width:120px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:16px}.st{background:#fff;border:1px solid var(--b);border-radius:12px;padding:13px;text-align:center}.st b{display:block;font-size:26px;color:var(--p)}.st span{font-size:12.5px;color:var(--m)}

const logo=c=>`<img class="logo ${c||''}" src="assets/logo.png" alt="GM Design" onerror="this.onerror=null;this.src=LOGO_FB">`;
const fileField=(id,label,hint)=>fld(label,`<div class="fpick"><input id="${id}" type="file" accept="image/*" class="fin"><span class="fbtn">${ic('plus',16)} اختر صورة</span><span class="fname m">لم يتم اختيار ملف</span></div>`,hint);
document.addEventListener('change',e=>{const i=e.target;if(i&&i.classList&&i.classList.contains('fin')){const n=i.parentNode.querySelector('.fname');n.textContent=i.files[0]?'تم اختيار الملف:\n'+i.files[0].name:'لم يتم اختيار ملف'}});
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const fDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'}):'';
const fTime=t=>{if(!t)return'';const[h,m]=t.split(':'),d=new Date();d.setHours(+h,+m,0);return d.toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})};
const fStamp=i=>i?new Date(i).toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'long',timeStyle:'short'}):'';
const waNum=p=>{let n=(p||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='966'+n.slice(1);else if(!n.startsWith('966'))n='966'+n;return n};
const waLink=(p,t)=>`https://wa.me/${waNum(p)}?text=${encodeURIComponent(t)}`;
const phoneCheck=p=>{const r=(p||'').trim();if(!r)return{ok:0,why:'الرقم فارغ'};if(!/^\d+$/.test(r))return{ok:0,why:'يحتوي على رموز غير مسموحة'};if(!r.startsWith('05'))return{ok:0,why:'لا يبدأ بـ 05'};if(r.length!==10)return{ok:0,why:'يجب أن يكون 10 أرقام'};return{ok:1}};
const compTxt=(n,f)=>n>0?(f==='includes'?`الدعوة تشمل (${toAr(n)}) أشخاص`:`عدد المرافقين / ${toAr(n)}`):'';

function makeTicket(t,o){const qs=o.size,d=document.createElement('div');
 new QRCode(d,{text:link('scan',t.qr_token),width:400,height:400,colorDark:o.color,colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
 const q=d.querySelector('canvas'),c=document.createElement('canvas'),x=c.getContext('2d');let qx,qy;
 if(o.img){c.width=o.img.width;c.height=o.img.height;x.drawImage(o.img,0,0);qx=o.x-qs/2;qy=o.y-qs/2}
 else{c.width=Math.max(qs+80,360);c.height=qs+150;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);qx=(c.width-qs)/2;qy=75}
 x.drawImage(q,qx,qy,qs,qs);x.fillStyle=o.color;x.textAlign='center';x.direction='rtl';
 const cx=qx+qs/2,F='Tajawal,sans-serif';let y=qy-6;x.textBaseline='bottom';
 const cp=compTxt(t.companions_count,t.companions_format);
 if(cp){x.font='bold 20px '+F;x.fillText(cp,cx,y);y-=26}
 if(t.label){x.font='bold 28px '+F;x.fillText(t.label,cx,y)}else{x.textBaseline='top';x.font='bold 24px '+F;x.fillText(toAr(t.ticket_number),cx,qy+qs+6)}
 return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

async function updEv(k,v){const{error}=await sb.from('events').update({[k]:v}).eq('id',E.ev.id);if(error)return dbErr(error,'تعذر الحفظ');E.ev[k]=v;toast('تم الحفظ','ok')}
async function updBM(v){const u={barcode_mode:v};if(v!=='hidden')u.link_mode='personal';const{error}=await sb.from('events').update(u).eq('id',E.ev.id);if(error)return dbErr(error,'تعذر حفظ الإعدادات، راجع إعدادات قاعدة البيانات.');Object.assign(E.ev,u);toast('تم الحفظ','ok');route()}
async function saveColor(){const c=$('#bcc').value,{error}=await sb.from('barcode_settings').upsert({event_id:E.ev.id,barcode_color:c,number_color:c,name_color:c},{onConflict:'event_id'});toast(error?'تعذر الحفظ':'تم حفظ اللون',error?'no':'ok')}
async function delEv(){if(!confirm('حذف المناسبة وجميع ضيوفها؟'))return;const{error}=await sb.from('events').delete().eq('id',E.ev.id);if(error)return dbErr(error,'تعذر الحذف');toast('تم الحذف','ok');location.hash='#/invites'}

function parseGuests(raw){return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=(l.includes(',')?l.split(','):l.includes('\t')?l.split('\t'):l.split(/\s+/)).map(x=>x.trim());let name=null,phone,n=0;
 if(p.length>=3){name=p[0];phone=p[1];n=Math.max(0,parseInt(p[2],10)||0)}else if(p.length===2){name=p[0];phone=p[1]}else phone=p[0];return{name,phone,n}})}
function tGuests(){const f=E.filter||'';const list=E.gs.filter(g=>!f||(f==='none'?!g.inviter_id:g.inviter_id===f));
 const row=g=>{const k=phoneCheck(g.phone),iv=E.iv.find(i=>i.id===g.inviter_id);
  return`<div class="r ${k.ok?'':'bad'}"><div class="i"><b>${esc(g.name||'بدون اسم')} <small>#${g.ticket_number}</small></b><small dir="ltr">${esc(g.phone)}</small>${k.ok?'':`<small class="er">${k.why}</small>`}<small>${iv?esc(iv.name):'بدون داعية'}${g.companions_count?' — '+compTxt(g.companions_count):''}</small></div>
<div class="a">${badge(g.status)}${g.qr_status==='used'?'<span class="bg u">حضر</span>':''}<button class="btn bo bs" onclick="copy('${link('t',g.invite_token)}')">نسخ الرابط</button>
${g.status==='declined'&&can('guests')?`<button class="btn bo bs" onclick="repModal('${g.id}')">استبدال</button>`:''}${g.qr_status==='used'&&can('reactivate')?`<button class="btn bo bs" onclick="react('guest','${g.id}')">إعادة تفعيل</button>`:''}${can('delete')?`<button class="btn bd bs" onclick="delGuest('${g.id}')">حذف</button>`:''}</div></div>`};
 return`<div class="row bt" style="margin-bottom:14px"><select style="max-width:240px" onchange="E.filter=this.value;route()"><option value="">كل الداعيات</option><option value="none" ${f==='none'?'selected':''}>بدون داعية</option>${E.iv.map(i=>`<option value="${i.id}" ${f===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select>${can('guests')?`<button class="btn bp" onclick="addModal()">${ic('plus',17)} إضافة ضيوف</button>`:''}</div>${list.map(row).join('')||'<div class="em">لا يوجد ضيوف</div>'}`}
function addModal(){modal(`<h2>إضافة ضيوف</h2><form id="af">${fld('الداعية',`<select id="ai"><option value="">بدون داعية</option>${E.iv.filter(i=>i.is_active).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select>`)}
${fld('الضيوف','<textarea id="ag" rows="6" required placeholder="سالم العتيبي, 0501234567, 2&#10;نورة القحطاني, 0559876543"></textarea>','سطر لكل ضيف: الاسم، الجوال، عدد المرافقين (اختياري)')}
<div class="row"><button type="button" class="btn bo x1" onclick="closeM()">إلغاء</button><button id="ab" class="btn bp x1">إضافة</button></div></form>`);
 $('#af').onsubmit=async e=>{e.preventDefault();const p=parseGuests($('#ag').value),b=$('#ab');load(b,1,'جاري الإضافة...');
  const{error}=await sb.from('guests').insert(p.map(x=>({event_id:E.ev.id,inviter_id:$('#ai').value||null,name:x.name,phone:x.phone,companions_count:x.n})));
  load(b,0);if(error)return dbErr(error,'تعذرت الإضافة');closeM();toast(`تمت إضافة ${p.length} ضيف`,'ok');route()}}
function repModal(id){modal(`<h2>استبدال ضيف معتذر</h2><p class="m">سيُلغى رابط وباركود الضيف السابق ويُنشأ جديدان للبديل.</p><form id="rf">${fld('اسم الضيف الجديد','<input id="rn" required>')}${fld('الجوال','<input id="rp" required dir="ltr">')}${fld('المرافقين','<input id="rc" type="number" min="0" value="0">')}
<div class="row"><button type="button" class="btn bo x1" onclick="closeM()">إلغاء</button><button id="rb" class="btn bp x1">استبدال</button></div></form>`);
 $('#rf').onsubmit=async e=>{e.preventDefault();const b=$('#rb');load(b,1);const{error}=await sb.rpc('replace_guest',{p_old:id,p_name:$('#rn').value.trim(),p_phone:$('#rp').value.trim(),p_companions:+$('#rc').value||0});
  load(b,0);if(error)return dbErr(error,'تعذر الاستبدال');closeM();toast('تم الاستبدال وسُجّل في سجل التدقيق','ok');route()}}

${E.iv.map(i=>{const n=E.gs.filter(g=>g.inviter_id===i.id).length,lk=E.lk.find(l=>l.inviter_id===i.id);
 return`<div class="r"><div class="i"><b>${esc(i.name)}</b><small>${n} ضيف${i.guest_limit?' من '+i.guest_limit:''} — ${i.is_active?'الرابط فعال':'الرابط معطل'}</small></div>
<div class="a"><button class="btn bo bs" onclick="copy('${link('token',i.access_token)}')">رابط الداعية</button>
${E.ev.barcode_mode!=='hidden'?'':lk?`<button class="btn bo bs" onclick="copy('${link('list',lk.token)}')">الرابط الموحد</button><button class="btn bo bs" onclick="toggleLk('${lk.id}')">تعطيل الموحد</button>`:can('inviters')?`<button class="btn bo bs" onclick="mkLk('${i.id}')">إنشاء رابط موحد</button>`:''}

function ivModal(){modal(`<h2>داعية جديدة</h2><form id="vf">${fld('اسم الداعية / القائمة','<input id="vn" required maxlength="120" placeholder="معازيم أم العروس">')}${fld('الحد الأقصى للضيوف (اختياري)','<input id="vl" type="number" min="1">')}
${E.ev.barcode_mode==='hidden'?fld('نمط الروابط','<select id="vm"><option value="">حسب المناسبة</option><option value="personal">رابط شخصي لكل ضيف</option><option value="shared">رابط موحد</option></select>'):'<p class="h">عند تفعيل الباركود يتم استخدام روابط فردية تلقائياً لكل ضيف.</p>'}<label class="row"><input id="vc" type="checkbox" checked> يسمح لها بإضافة ضيوف</label>
<div class="row" style="margin-top:14px"><button type="button" class="btn bo x1" onclick="closeM()">إلغاء</button><button class="btn bp x1">إنشاء</button></div></form>`);
 $('#vf').onsubmit=async e=>{e.preventDefault();const{error}=await sb.from('inviters').insert({event_id:E.ev.id,name:$('#vn').value.trim(),guest_limit:+$('#vl').value||null,link_mode:$('#vm')?($('#vm').value||null):'personal',can_edit_guests:$('#vc').checked});if(error)return dbErr(error,'تعذر الإنشاء');closeM();toast('تم إنشاء الداعية','ok');route()}}
async function togIv(id,v){const{error}=await sb.from('inviters').update({is_active:v}).eq('id',id);if(error)return dbErr(error,'تعذر التحديث');route()}
async function delIv(id){if(!confirm('حذف الداعية؟ سيبقى ضيوفها بدون داعية.'))return;const{error}=await sb.from('inviters').delete().eq('id',id);if(error)return dbErr(error,'تعذر الحذف');route()}

const DM='السلام عليكم\nيسرنا دعوتكم لحضور المناسبة';
function tSend(){return`<div class="card">${fld('نص الرسالة (يُضاف اسم الضيف ورابط الدعوة تلقائيًا)',`<textarea id="sm">${DM}</textarea>`)}</div>
${E.gs.map(g=>`<div class="r"><div class="i"><b>${esc(g.name||'بدون اسم')}</b><small dir="ltr">${esc(g.phone)}</small></div><div class="a"><span class="bg ${g.invited_at?'ok':''}">${g.invited_at?'تم الإرسال':'لم يُرسل'}</span><button class="btn bp bs" onclick="sendWa('${g.id}')">واتساب</button></div></div>`).join('')||'<div class="em">أضيفي ضيوفًا أولًا</div>'}`}
async function sendWa(id){const g=E.gs.find(x=>x.id===id),m=`${g.name?'المكرمة:\n'+g.name+'\n\n':''}${$('#sm').value.trim()}\n\nرابط الدعوة:\n${link('t',g.invite_token)}`;
 window.open(waLink(g.phone,m),'_blank','noopener');await sb.from('guests').update({invited_at:new Date().toISOString()}).eq('id',id);g.invited_at=new Date().toISOString();const t=$('#sm').value;mount(shell(`<h1>${esc(E.ev.name)}</h1><div class="tabs"><a href="#/event/${E.ev.id}/overview">نظرة عامة</a><a href="#/event/${E.ev.id}/guests">الضيوف</a><a href="#/event/${E.ev.id}/inviters">الداعيات</a><a class="on">الإرسال</a></div>${tSend()}`,'invites'));$('#sm').value=t}

/* ===== الصفحات العامة: الدعوة / الرابط الموحد / بوابة الداعية / إحصائيات المالك ===== */
async function vInvite(t){pub(LD);const{data:d,error}=await sb.rpc('get_guest_invite',{p_invite_token:t});
 if(error||!d)return pub('<div class="em"><h2>الدعوة غير موجودة</h2><p>تحقق من الرابط أو تواصل مع منظّم المناسبة</p></div>');
 const nm=(d.guest_name||'').trim(),cp=compTxt(d.companions_count);let body='';
 if(d.status==='pending'&&d.requires_rsvp)body=`<div class="row" style="flex-direction:column;align-items:stretch"><button class="btn bp bk" onclick="rsvp('${esc(t)}','confirmed')">أؤكد حضوري</button><button class="btn bo bk" onclick="rsvp('${esc(t)}','declined')">أعتذر عن الحضور</button></div>`;
 else if(d.status==='declined')body='<div class="sr no">تم تسجيل اعتذاركم. نتمنى لكم مناسبة سعيدة</div>';
 if(d.status==='confirmed'&&d.requires_rsvp)body+='<div class="sr ok">تم تأكيد حضوركم</div>';
 if(d.qr_token)body+=`<div class="card" style="margin-top:14px"><b>${nm?'المكرمة: '+esc(nm):'رقم الدعوة: '+toAr(d.ticket_number)}</b>${cp?`<p>${esc(cp)}</p>`:''}<div id="qq" style="display:flex;justify-content:center"></div>${d.qr_status==='used'?'<p class="er">تم تسجيل حضور هذه الدعوة</p>':''}</div>`;
 pub(`<div class="inv card">${d.image_url?`<img class="cv" src="${esc(d.image_url)}" alt="">`:''}<h2>${esc(d.event_name)}</h2><p>${nm?'مرحبًا، المكرمة:<br><b>'+esc(nm)+'</b>':'مرحبًا بضيفنا الكريم'}</p>
<div class="det"><div>${fDate(d.event_date)}</div><div>${fTime(d.event_time)}</div><div>${ic('pin',18)} ${esc(locName(d))}</div></div>${mapBtn(d.location_url)}${d.description?`<p class="m">${esc(d.description)}</p>`:''}${body}</div>`);
 if(d.qr_token)drawQr('qq',link('scan',d.qr_token),d.barcode_color,210)}
async function rsvp(t,s){const{error}=await sb.rpc('respond_to_invite',{p_invite_token:t,p_status:s});if(error)return dbErr(error,'تعذر تسجيل ردكم');vInvite(t)}
async function vShared(tok){pub(LD);const{data:d}=await sb.rpc('get_shared_link_info',{p_token:tok});
 if(!d)return pub('<div class="em"><h2>الرابط غير صالح</h2></div>');
 pub(`<div class="inv card"><h2>${esc(d.event_name)}</h2><p class="m">${fDate(d.event_date)} — ${fTime(d.event_time)}<br>${esc(locName(d))}<br>القائمة: ${esc(d.inviter_name)}</p><form id="sf" style="text-align:right">${fld('الاسم','<input id="sn" required maxlength="120">')}${fld('رقم الجوال','<input id="sp" required dir="ltr" inputmode="tel" placeholder="05xxxxxxxx">')}<button id="sb" class="btn bp bk">تسجيل والحصول على الدعوة</button></form></div>`);
 $('#sf').onsubmit=async e=>{e.preventDefault();const b=$('#sb');load(b,1);const{data:t,error}=await sb.rpc('register_via_shared_link',{p_token:tok,p_name:$('#sn').value.trim(),p_phone:$('#sp').value.trim()});load(b,0);
  if(error)return dbErr(error,'تعذر التسجيل');location.href=link('t',t)}}
async function vInviter(tok){pub(LD);const{data:d}=await sb.rpc('inviter_get_portal',{p_access_token:tok});
 if(!d)return pub('<div class="em"><h2>الرابط غير صالح أو معطّل</h2></div>');
 const gs=d.guests||[],msgOf=g=>`${g.name?'المكرمة:\n'+g.name+'\n\n':''}السلام عليكم\nيسرنا دعوتكم لحضور ${d.event_name}\n\nرابط الدعوة:\n${link('t',g.invite_token)}`;
 window._ptok=tok;window._pg=gs;window._pm=msgOf;
 pub(`<div style="padding:22px 0"><p class="m">${esc(d.event_name)} — ${fDate(d.event_date)}</p><h1>${esc(d.inviter_name)}</h1><div class="sg">${statCards(rpcStats(d.stats))}</div>
${d.can_edit_guests?`<div class="card"><h3>إضافة ضيف</h3><form id="pf" class="row">${fld('الاسم','<input id="pn">').replace('class="f"','class="f x1"')}${fld('الجوال','<input id="pp" required dir="ltr">').replace('class="f"','class="f x1"')}${fld('المرافقين','<input id="pc" type="number" min="0" value="0" style="width:90px">')}<button class="btn bp" style="margin-bottom:14px">إضافة</button></form></div>`:''}
${d.link_mode==='shared'&&d.shared_token?`<button class="btn bo" onclick="copy('${link('list',d.shared_token)}')" style="margin-bottom:14px">نسخ الرابط الموحد للقائمة</button>`:''}
${gs.map((g,i)=>`<div class="r"><div class="i"><b>${esc(g.name||'بدون اسم')}</b><small dir="ltr">${esc(g.phone)}</small>${g.companions_count?`<small>${esc(compTxt(g.companions_count))}</small>`:''}</div><div class="a">${badge(g.status)}${g.qr_status==='used'?'<span class="bg u">حضر</span>':''}<span class="bg ${g.invited_at?'ok':''}">${g.invited_at?'أُرسلت':'لم تُرسل'}</span>
<button class="btn bp bs" onclick="pSend(${i})">واتساب</button><button class="btn bo bs" onclick="copy('${link('t',g.invite_token)}')">نسخ</button></div></div>`).join('')||'<div class="em">لا يوجد ضيوف في قائمتك</div>'}</div>`);
 const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const{error}=await sb.rpc('inviter_add_guest',{p_access_token:tok,p_name:$('#pn').value.trim(),p_phone:$('#pp').value.trim(),p_companions:+$('#pc').value||0});if(error)return dbErr(error,'تعذرت الإضافة');toast('تمت الإضافة','ok');vInviter(tok)}}

/* ===== الماسح (للموظفين فقط، التسجيل ذري داخل RPC) ===== */
const extractTok=t=>{try{return new URL(t).searchParams.get('scan')||t}catch(e){return t}};
function showScan(d,el){const m={success:['ok','تذكرة صالحة وتم تسجيل الدخول'],already_used:['no','تذكرة مستخدمة مسبقًا'],disabled:['no','الباركود معطّل أو الضيف معتذر/مُستبدل'],not_confirmed:['u','الضيف لم يؤكد حضوره'],not_found:['u','رمز غير معروف']}[d.result]||['u',d.result];
 el.innerHTML=`<div class="sr ${m[0]}"><div style="font-size:19px">${m[1]}</div>${d.name?`<div>${esc(d.name)}</div>`:''}${d.list_name?`<div>${esc(d.list_name)}</div>`:''}${d.companions?`<div>${esc(compTxt(d.companions))}</div>`:''}${d.event_name?`<div class="m">${esc(d.event_name)}</div>`:''}${d.result==='already_used'?`<div>أول مسح: ${fStamp(d.first_scan_at)}</div>`:''}</div>`}
async function vScanner(tok){if(!can('scan')){mount(shell('<div class="em">لا تملك صلاحية المسح</div>','scanner'));return}
 mount(shell(`<h1>ماسح الباركود</h1><div class="card"><div id="rd" style="max-width:360px;margin:auto"></div><div id="sr"></div></div>`,'scanner'));
 const out=$('#sr');let busy=false;
 const run=async t=>{out.innerHTML=LD;const{data,error}=await sb.rpc('checkin_ticket',{p_qr_token:t});if(error)out.innerHTML=`<div class="sr no">${esc(error.message)}</div>`;else showScan(data,out)};
 if(tok)run(tok);
 try{S.cam=new Html5Qrcode('rd');await S.cam.start({facingMode:'environment'},{fps:10,qrbox:240},async txt=>{if(busy)return;busy=true;await run(extractTok(txt));setTimeout(()=>busy=false,2500)},()=>{})}catch(e){toast('تعذر تشغيل الكاميرا','no')}}

 if(S.me.role==='super_admin'){const[{data:ps},{data:pm}]=await Promise.all([sb.from('profiles').select('*').order('created_at'),sb.from('admin_permissions').select('*')]);
  const L=[['can_manage_events','المناسبات'],['can_manage_inviters','الداعيات'],['can_manage_guests','الضيوف'],['can_manage_barcodes','الباركودات'],['can_scan','المسح'],['can_reactivate','إعادة التفعيل'],['can_delete','الحذف']];
  staff=`<div class="card"><h3>الموظفون</h3>${(ps||[]).map(p=>{const a=(pm||[]).find(x=>x.admin_id===p.id)||{};return`<div class="r"><div class="i"><b>${esc(p.full_name)}</b><small>${p.role==='super_admin'?'مدير المتجر':'أدمن'}</small></div>${p.role==='admin'?`<div class="a">${L.map(([k,l])=>`<label class="row" style="font-size:13px"><input type="checkbox" ${a[k]?'checked':''} onchange="setPerm('${p.id}','${k}',this.checked)">${l}</label>`).join('')}<label class="row" style="font-size:13px"><input type="checkbox" ${p.is_active?'checked':''} onchange="setActive('${p.id}',this.checked)">فعّال</label></div>`:''}</div>`}).join('')}
<hr style="border:0;border-top:1px solid var(--b);margin:16px 0"><h3>إضافة موظف</h3><p class="m">أنشئي المستخدم من Supabase > Authentication > Users ثم الصقي معرّفه هنا.</p>
<form id="sf2">${fld('معرّف المستخدم (UUID)','<input id="su" required dir="ltr">')}${fld('الاسم','<input id="sn2" required>')}${fld('الدور','<select id="sr2"><option value="admin">أدمن</option><option value="super_admin">مدير المتجر</option></select>')}<button class="btn bp">إضافة</button></form></div>`}
 mount(shell(`<h1>الإعدادات</h1><div class="card"><b>${esc(S.me.full_name)}</b><p class="m">${S.me.role==='super_admin'?'مدير المتجر (Super Admin)':'أدمن'}</p></div>${staff}`,'settings'));
 const f=$('#sf2');if(f)f.onsubmit=async e=>{e.preventDefault();const{error}=await sb.rpc('create_staff_profile',{p_user_id:$('#su').value.trim(),p_full_name:$('#sn2').value.trim(),p_role:$('#sr2').value});if(error)return dbErr(error,'تعذرت الإضافة');toast('تمت الإضافة','ok');vSettings()}}
async function setPerm(id,k,v){const{error}=await sb.from('admin_permissions').update({[k]:v}).eq('admin_id',id);toast(error?'تعذر الحفظ':'تم الحفظ',error?'no':'ok')}
async function setActive(id,v){const{error}=await sb.from('profiles').update({is_active:v}).eq('id',id);toast(error?'تعذر الحفظ':'تم الحفظ',error?'no':'ok')}

/* ===== الموجّه ===== */
async function route(){if(S.cam){try{await S.cam.stop()}catch(e){}S.cam=null}
 const q=new URLSearchParams(location.search);
 if(q.get('t'))return vInvite(q.get('t'));if(q.get('list'))return vShared(q.get('list'));
 if(q.get('token'))return vInviter(q.get('token'));if(q.get('owner'))return vOwner(q.get('owner'));
 if(!S.me&&!await loadMe())return vLogin();
 if(q.get('scan'))return vScanner(q.get('scan'));
 const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 if(!p.length||p[0]==='login'){location.hash='#/home';return}
 ({home:vHome,barcodes:vBarcodes,invites:vInvites,scanner:()=>vScanner(),settings:vSettings,folder:()=>vFolder(p[1]),event:()=>vEvent(p[1],p[2])}[p[0]]||vHome)()}
addEventListener('hashchange',route);addEventListener('DOMContentLoaded',route);
</script>
